[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-signal"
version = "0.1.0"
description = "Evidence-led legal entity monitoring and review workflows"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "httpx>=0.27,<1",
  "langgraph>=0.6,<2",
  "pydantic>=2.10,<3",
  "streamlit>=1.50,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
trust-signal = "trust_signal.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
